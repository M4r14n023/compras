<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista del Super</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Librería para exportar a PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffdf7;
    --ink: #1a1a1a;
    --muted: #888;
    --accent: #e85d26;
    --accent-hover: #c94d1c;
    --accent2: #2d6a4f;
    --accent3: #e9c46a;
    --border: #e0d8cc;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: #fff;
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--accent3); }

  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;}

  .btn-icon {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.2); }
  .btn-icon.action { background: rgba(233, 196, 106, 0.2); color: var(--accent3); }
  .btn-icon.action:hover { background: rgba(233, 196, 106, 0.3); }

  /* ── TABS ── */
  .tabs { display: flex; gap: 10px; padding-bottom: 12px; }
  .tab-btn {
    flex: 1; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
    border: none; padding: 10px; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--accent3); color: var(--ink); }

  /* ── PROGRESS ── */
  .progress-bar { background: var(--ink); padding: 0 20px 14px; }
  .progress-track { background: rgba(255,255,255,0.15); border-radius: 99px; height: 5px; overflow: hidden; }
  .progress-fill { background: var(--accent3); height: 100%; border-radius: 99px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .progress-label { font-size: 0.75rem; color: rgba(255,255,255,0.7); margin-top: 6px; font-weight: 500; text-align: center; }

  /* ── MAIN ── */
  main { padding: 16px 16px 100px; max-width: 680px; margin: 0 auto; }

  /* ── SECTOR CARD ── */
  .sector {
    background: var(--card); border-radius: var(--radius); margin-bottom: 12px;
    box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid var(--border);
  }
  .sector-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; background: var(--card);
  }
  .sector-emoji { font-size: 1.3rem; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 10px; flex-shrink: 0; }
  .sector-title { font-family: 'Syne', sans-serif; font-size: 0.92rem; font-weight: 700; flex: 1; }
  .sector-count { font-size: 0.72rem; color: var(--muted); font-weight: 700; background: var(--bg); border-radius: 20px; padding: 3px 10px; }
  .sector-count.has-items { background: #ffe4cc; color: var(--accent); }
  .sector-count.all-done { background: #d4edda; color: var(--accent2); }
  .sector-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.25s; }
  .sector.open .sector-chevron { transform: rotate(180deg); }

  /* ── ITEMS ── */
  .sector-body { display: none; border-top: 1.5px solid var(--border); padding: 8px 12px 12px; }
  .sector.open .sector-body { display: block; }
  .item-list { list-style: none; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-bottom: 1px solid var(--border); border-radius: 8px; margin-bottom: 2px; }
  .item.selected-mode-armar { background-color: rgba(232, 93, 38, 0.08); border-bottom-color: transparent; }
  .item-check { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 7px; flex-shrink: 0; cursor: pointer; background: #fff; display: flex; align-items: center; justify-content: center; }
  .item-check.is-selected { background: var(--accent); border-color: var(--accent); }
  .item-check.is-selected::after { content: '+'; color: #fff; font-size: 16px; font-weight: 700; }
  .item-check.is-purchased { background: var(--accent2); border-color: var(--accent2); }
  .item-check.is-purchased::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }
  .item-name { flex: 1; font-size: 0.95rem; font-weight: 500; line-height: 1.3; }
  .item.purchased .item-name { text-decoration: line-through; color: var(--muted); }
  .item-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 4px; border-radius: 6px; }

  /* ── ADD ITEM ── */
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-input { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; outline: none; }
  .add-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 16px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .big { font-size: 3rem; margin-bottom: 12px; }

  /* ── FAB ── */
  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; border: none; border-radius: 99px; padding: 14px 28px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 20px rgba(232,93,38,0.4); z-index: 50; }

  /* ── MODALS ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--card); border-radius: 24px 24px 0 0; padding: 28px 24px 40px; width: 100%; max-width: 680px; transform: translateY(40px); transition: transform 0.3s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
  .modal p { font-size: 0.9rem; color: var(--muted); margin-bottom: 15px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px;}
  .modal-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  .modal-btn.cancel { background: var(--bg); color: var(--ink); }
  .modal-btn.confirm { background: var(--accent); color: #fff; }
  
  .sync-textarea { width: 100%; height: 120px; border-radius: 8px; border: 1px solid var(--border); padding: 10px; font-family: monospace; font-size: 0.8rem; resize: none; margin-bottom: 10px;}

  /* ── TOAST ── */
  .toast { position: fixed; top: 140px; left: 50%; transform: translateX(-50%) translateY(-10px); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 99px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 300; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── ESTILOS EXPORTACIÓN PDF ── */
  .exporting-pdf { background: #fff !important; }
  .exporting-pdf .sector { box-shadow: none !important; border: none !important; border-bottom: 1px solid #ccc !important; border-radius: 0 !important; margin-bottom: 5px !important;}
  .exporting-pdf .sector-chevron, 
  .exporting-pdf .add-row, 
  .exporting-pdf .item-del { display: none !important; }
  .exporting-pdf .sector-body { display: block !important; border-top: none !important; padding: 0 !important; }
  .exporting-pdf .item { border-bottom: none !important; padding: 4px 8px !important; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🛒 Lista del <span>Super</span></h1>
    <div class="header-actions">
      <button class="btn-icon action" onclick="exportPDF()">📄 PDF</button>
      <button class="btn-icon action" onclick="openSyncModal()">🔄 Sync</button>
      <button class="btn-icon" onclick="expandAll()">↕ Exp</button>
    </div>
  </div>
  
  <div class="tabs">
    <button id="tab-armar" class="tab-btn active" onclick="setMode('armar')">📝 Armar Lista</button>
    <button id="tab-comprar" class="tab-btn" onclick="setMode('comprar')">🛒 De Compras</button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">--</div>
</div>

<main id="mainContent"></main>

<button class="fab" onclick="confirmClear()">✦ Vaciar y Empezar de Cero</button>

<!-- Modal Nueva Compra -->
<div class="modal-overlay" id="modalClear" onclick="closeModals(event)">
  <div class="modal">
    <h2>¿Empezar una nueva compra?</h2>
    <p>Se desmarcarán todos los productos de tu carrito. Los productos personalizados se conservarán.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModals()">Cancelar</button>
      <button class="modal-btn confirm" onclick="startNewTrip()">Vaciar Lista</button>
    </div>
  </div>
</div>

<!-- Modal Sincronización -->
<div class="modal-overlay" id="modalSync" onclick="closeModals(event)">
  <div class="modal">
    <h2>Sincronizar Dispositivos</h2>
    <p><b>Para exportar:</b> Copiá este código y mandalo a tu celular.<br><b>Para importar:</b> Pegá acá el código que recibiste y tocá Cargar.</p>
    <textarea id="syncData" class="sync-textarea" placeholder="Pegá el código acá..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="copySyncData()">Copiar Código</button>
      <button class="modal-btn confirm" onclick="importSyncData()">Cargar Código</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE_SECTORS = [
  { id: 'almacen', emoji: '🫙', name: 'Almacén / Despensa', items: ['Tapas de empanada/tarta', 'Arroz', 'Fideos/pasta', 'Polenta', 'Avena', 'Harina', 'Pan rallado', 'Legumbres secas', 'Tomate triturado/puré', 'Atún/sardina', 'Choclo en lata', 'Arvejas en lata', 'Garbanzos en lata', 'Duraznos en almíbar', 'Aceite', 'Vinagre', 'Sal', 'Azúcar', 'Caldos', 'Salsa de soja', 'Ketchup', 'Mayonesa', 'Mostaza', 'Café', 'Té', 'Yerba', 'Cacao', 'Leche larga vida', 'Galletitas dulces', 'Galletitas saladas', 'Cereales', 'Mermelada', 'Dulce de leche', 'Frutos secos', 'Papas fritas', 'Galletitas de agua'] },
  { id: 'lacteos', emoji: '🧀', name: 'Lácteos y Frescos', items: ['Leche', 'Yogur', 'Queso crema', 'Queso rallado', 'Manteca/margarina', 'Huevos', 'Jamón', 'Queso en fetas', 'Salame', 'Pan de molde', 'Tortillas'] },
  { id: 'carnes', emoji: '🥩', name: 'Carnes y Congelados', items: ['Pollo', 'Carne vacuna', 'Cerdo', 'Pescado', 'Verduras congeladas', 'Papas noisette', 'Medallones', 'Pizzas congeladas'] },
  { id: 'frutas', emoji: '🥦', name: 'Frutas y Verduras', items: ['Lechuga', 'Tomate', 'Cebolla', 'Morrón', 'Zanahoria', 'Papa', 'Zapallo', 'Limón', 'Banana', 'Manzana', 'Naranja', 'Ajo'] },
  { id: 'limpieza', emoji: '🧹', name: 'Artículos de Limpieza', items: ['Lavandina', 'Desinfectante', 'Limpiador multiuso', 'Limpiavidrios', 'Desengrasante', 'Jabón líquido/polvo', 'Suavizante', 'Quitamanchas', 'Detergente', 'Esponjas', 'Virulana', 'Trapo de piso', 'Bolsas de basura', 'Papel aluminio', 'Film'] },
  { id: 'higiene', emoji: '🧴', name: 'Higiene Personal', items: ['Shampoo', 'Acondicionador', 'Jabón/gel', 'Desodorante', 'Crema corporal', 'Pasta dental', 'Cepillo dental', 'Papel higiénico', 'Rollo de cocina', 'Máquina de afeitar', 'Protectores/Toallitas'] },
  { id: 'bebidas', emoji: '🥤', name: 'Bebidas', items: ['Agua mineral', 'Agua saborizada', 'Gaseosas', 'Jugos', 'Vino', 'Cerveza'] },
  { id: 'extras', emoji: '🐾', name: 'Mascotas / Extras', items: ['Alimento mascotas', 'Arena sanitaria', 'Snacks mascotas', 'Pilas', 'Lámparas'] }
];

const LS_KEY = 'superapp_v3';
let state = [];
let currentMode = 'armar';

function loadState() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return null;
}

function saveState(data) { localStorage.setItem(LS_KEY, JSON.stringify(data)); }

function buildFreshState(existingCustom) {
  return BASE_SECTORS.map(sector => {
    const custom = (existingCustom && existingCustom[sector.id]) || [];
    const allItems = [...new Set([...sector.items, ...custom])];
    return {
      id: sector.id, emoji: sector.emoji, name: sector.name,
      items: allItems.map(name => ({ name, selected: false, purchased: false })),
      custom: custom, open: false
    };
  });
}

function initState() {
  const saved = loadState();
  if (saved && saved.sectors) {
    state = saved.sectors;
    state.forEach(s => {
      const base = BASE_SECTORS.find(b => b.id === s.id);
      if (base) {
        base.items.forEach(name => {
          if (!s.items.find(i => i.name === name)) s.items.unshift({ name, selected: false, purchased: false });
        });
      }
    });
  } else {
    state = buildFreshState(null);
  }
  if (state.length > 0 && state.every(s => !s.open)) state[0].open = true;
  persist();
}

function persist() { saveState({ sectors: state }); }

function setMode(mode) {
  currentMode = mode;
  document.getElementById('tab-armar').className = mode === 'armar' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tab-comprar').className = mode === 'comprar' ? 'tab-btn active' : 'tab-btn';
  render();
}

function render() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';
  let totalSelectedForTrip = 0;

  if (currentMode === 'armar') {
    state.forEach(sector => {
      const selectedCount = sector.items.filter(i => i.selected).length;
      totalSelectedForTrip += selectedCount;
      const countClass = selectedCount > 0 ? 'sector-count has-items' : 'sector-count';

      const card = document.createElement('div');
      card.className = 'sector' + (sector.open ? ' open' : '');
      card.innerHTML = `
        <div class="sector-header" onclick="toggleSector('${sector.id}')">
          <div class="sector-emoji">${sector.emoji}</div>
          <div class="sector-title">${sector.name}</div>
          <div class="${countClass}">${selectedCount} en lista</div>
          <div class="sector-chevron">▼</div>
        </div>
        <div class="sector-body">
          <ul class="item-list" id="list-${sector.id}"></ul>
          <div class="add-row">
            <input class="add-input" id="input-${sector.id}" placeholder="Agregar producto…" onkeydown="if(event.key==='Enter') addItem('${sector.id}')">
            <button class="add-btn" onclick="addItem('${sector.id}')">Agregar</button>
          </div>
        </div>
      `;
      main.appendChild(card);
      const ul = document.getElementById('list-' + sector.id);
      sector.items.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'item' + (item.selected ? ' selected-mode-armar' : '');
        li.innerHTML = `
          <div class="item-check ${item.selected ? 'is-selected' : ''}" onclick="toggleSelect('${sector.id}', ${idx})"></div>
          <span class="item-name" onclick="toggleSelect('${sector.id}', ${idx})" style="cursor:pointer;">${item.name}</span>
          <button class="item-del" onclick="removeItem('${sector.id}', ${idx})">✕</button>
        `;
        ul.appendChild(li);
      });
    });
  } else {
    let hasAnyItem = false;
    state.forEach(sector => {
      const activeItems = sector.items.filter(i => i.selected);
      if (activeItems.length === 0) return;
      hasAnyItem = true;
      totalSelectedForTrip += activeItems.length;
      const purchasedCount = activeItems.filter(i => i.purchased).length;
      const isAllPurchased = purchasedCount === activeItems.length;
      const countClass = isAllPurchased ? 'sector-count all-done' : 'sector-count';
      const isOpen = isAllPurchased ? sector.open : true; 

      const card = document.createElement('div');
      card.className = 'sector' + (isOpen ? ' open' : '');
      card.innerHTML = `
        <div class="sector-header" onclick="toggleSector('${sector.id}')">
          <div class="sector-emoji">${sector.emoji}</div>
          <div class="sector-title">${sector.name}</div>
          <div class="${countClass}">${purchasedCount}/${activeItems.length} listos</div>
          <div class="sector-chevron">▼</div>
        </div>
        <div class="sector-body">
          <ul class="item-list" id="list-${sector.id}"></ul>
        </div>
      `;
      main.appendChild(card);
      const ul = document.getElementById('list-' + sector.id);
      sector.items.forEach((item, idx) => {
        if (!item.selected) return;
        const li = document.createElement('li');
        li.className = 'item' + (item.purchased ? ' purchased' : '');
        li.innerHTML = `
          <div class="item-check ${item.purchased ? 'is-purchased' : ''}" onclick="togglePurchase('${sector.id}', ${idx})"></div>
          <span class="item-name" onclick="togglePurchase('${sector.id}', ${idx})" style="cursor:pointer;">${item.name}</span>
        `;
        ul.appendChild(li);
      });
    });

    if (!hasAnyItem) {
      main.innerHTML = `<div class="empty-state"><div class="big">🛒</div><p>Tu carrito está vacío.<br>Ve a "Armar Lista" para agregar productos.</p></div>`;
    }
  }
  updateProgress();
}

function updateProgress() {
  let selected = 0, purchased = 0;
  state.forEach(s => {
    selected += s.items.filter(i => i.selected).length;
    purchased += s.items.filter(i => i.selected && i.purchased).length;
  });
  const fill = document.getElementById('progressFill'), label = document.getElementById('progressLabel');
  if (currentMode === 'armar') {
    fill.style.width = '100%'; fill.style.backgroundColor = 'var(--ink)';
    label.textContent = selected === 0 ? 'Selecciona los productos' : `🛒 ${selected} producto(s) en tu lista`;
  } else {
    const pct = selected ? Math.round((purchased / selected) * 100) : 0;
    fill.style.width = pct + '%'; fill.style.backgroundColor = 'var(--accent2)';
    label.textContent = selected === 0 ? 'Vacío' : (purchased === selected ? '¡Compras finalizadas! 🎉' : `Llevas ${purchased} de ${selected} (${pct}%)`);
  }
}

function toggleSector(id) { const s = state.find(s => s.id === id); if (s) { s.open = !s.open; persist(); render(); } }
function toggleSelect(sectorId, idx) { const s = state.find(s => s.id === sectorId); if (s) { s.items[idx].selected = !s.items[idx].selected; if (!s.items[idx].selected) s.items[idx].purchased = false; persist(); render(); } }
function togglePurchase(sectorId, idx) { const s = state.find(s => s.id === sectorId); if (s) { s.items[idx].purchased = !s.items[idx].purchased; persist(); render(); } }
function removeItem(sectorId, idx) { const s = state.find(s => s.id === sectorId); if (!s) return; const name = s.items[idx].name; s.items.splice(idx, 1); if (s.custom) s.custom = s.custom.filter(c => c !== name); persist(); render(); showToast(`Eliminado`); }
function addItem(sectorId) {
  const input = document.getElementById('input-' + sectorId), name = input.value.trim();
  if (!name) return; const s = state.find(s => s.id === sectorId); if (!s) return;
  if (s.items.find(i => i.name.toLowerCase() === name.toLowerCase())) { showToast('Ya está en la lista'); input.value = ''; return; }
  s.items.push({ name, selected: true, purchased: false });
  if (!s.custom) s.custom = []; s.custom.push(name);
  input.value = ''; s.open = true; persist(); render(); showToast(`Agregado`);
}
function expandAll() { const allOpen = state.every(s => s.open); state.forEach(s => s.open = !allOpen); persist(); render(); }

// Modals
function confirmClear() { document.getElementById('modalClear').classList.add('open'); }
function openSyncModal() {
  document.getElementById('syncData').value = JSON.stringify({ sectors: state });
  document.getElementById('modalSync').classList.add('open');
}
function closeModals(e) {
  if (e && e.target.classList && !e.target.classList.contains('modal-overlay')) return;
  document.getElementById('modalClear').classList.remove('open');
  document.getElementById('modalSync').classList.remove('open');
}
function startNewTrip() {
  state.forEach(s => s.items.forEach(i => { i.selected = false; i.purchased = false; }));
  persist(); closeModals(); setMode('armar'); showToast('Lista vaciada');
}

// Sync Functions
function copySyncData() {
  const data = document.getElementById('syncData');
  data.select();
  navigator.clipboard.writeText(data.value);
  showToast('¡Código copiado!');
}
function importSyncData() {
  try {
    const data = JSON.parse(document.getElementById('syncData').value);
    if (data && data.sectors) {
      state = data.sectors;
      persist(); render(); closeModals();
      showToast('¡Datos cargados con éxito!');
    } else { throw new Error('Formato inválido'); }
  } catch(e) { showToast('Error: Código inválido'); }
}

// PDF Export
function exportPDF() {
  if(currentMode !== 'comprar') {
      showToast('Cambiando a modo compras para exportar...');
      setMode('comprar');
  }
  
  // Forzar todos los sectores abiertos para que salgan en el PDF
  state.forEach(s => s.open = true);
  render();

  setTimeout(() => {
    document.body.classList.add('exporting-pdf');
    const element = document.getElementById('mainContent');
    const opt = {
      margin: 0.5,
      filename: 'Lista_Super.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
    };
    
    html2pdf().set(opt).from(element).save().then(() => {
      document.body.classList.remove('exporting-pdf');
      showToast('PDF Generado');
    });
  }, 500);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

initState(); render();
</script>
