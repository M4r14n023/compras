<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista del Super</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffdf7;
    --ink: #1a1a1a;
    --muted: #888;
    --accent: #e85d26;
    --accent2: #2d6a4f;
    --accent3: #e9c46a;
    --border: #e0d8cc;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: #fff;
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--accent3); }

  .header-actions { display: flex; gap: 8px; }

  .btn-icon {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.2); }
  .btn-icon.danger { background: rgba(232,93,38,0.3); }
  .btn-icon.danger:hover { background: rgba(232,93,38,0.5); }

  /* ── PROGRESS ── */
  .progress-bar {
    background: var(--ink);
    padding: 0 20px 14px;
  }
  .progress-track {
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    height: 5px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--accent3);
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.5);
    margin-top: 5px;
    font-weight: 500;
  }

  /* ── MAIN ── */
  main {
    padding: 16px 16px 100px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── SECTOR CARD ── */
  .sector {
    background: var(--card);
    border-radius: var(--radius);
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1.5px solid var(--border);
    transition: opacity 0.3s;
  }

  .sector-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: var(--card);
  }
  .sector-header:active { background: #f5f0e8; }

  .sector-emoji {
    font-size: 1.3rem;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border-radius: 10px;
    flex-shrink: 0;
  }

  .sector-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    flex: 1;
    letter-spacing: -0.2px;
  }

  .sector-count {
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 500;
    background: var(--bg);
    border-radius: 20px;
    padding: 2px 9px;
  }
  .sector-count.has-checked { background: #d4edda; color: var(--accent2); }

  .sector-chevron {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform 0.25s;
  }
  .sector.open .sector-chevron { transform: rotate(180deg); }

  /* ── ITEMS ── */
  .sector-body {
    display: none;
    border-top: 1.5px solid var(--border);
    padding: 8px 12px 12px;
  }
  .sector.open .sector-body { display: block; }

  .item-list { list-style: none; }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 6px;
    border-bottom: 1px solid var(--border);
    transition: opacity 0.2s;
  }
  .item:last-of-type { border-bottom: none; }

  .item-check {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 7px;
    flex-shrink: 0;
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item-check:hover { border-color: var(--accent2); }
  .item-check.checked {
    background: var(--accent2);
    border-color: var(--accent2);
  }
  .item-check.checked::after {
    content: '✓';
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }

  .item-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 400;
    transition: all 0.2s;
    line-height: 1.3;
  }
  .item.checked .item-name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .item-qty {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--bg);
    border-radius: 6px;
    padding: 2px 7px;
    font-weight: 500;
    min-width: 28px;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .item-qty:hover { border-color: var(--border); }

  .item-del {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px;
    line-height: 1;
    border-radius: 6px;
    transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item-del:hover { color: var(--accent); }

  /* ── ADD ITEM ── */
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .add-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: #bbb; }

  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .add-btn:hover { background: #c94d1c; }
  .add-btn:active { transform: scale(0.96); }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; margin-bottom: 20px; }

  /* ── FAB NEW COMPRA ── */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 99px;
    padding: 14px 28px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(232,93,38,0.4);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 50;
    white-space: nowrap;
  }
  .fab:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 24px rgba(232,93,38,0.5); }
  .fab:active { transform: translateX(-50%) scale(0.97); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    width: 100%;
    max-width: 680px;
    transform: translateY(40px);
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .modal p { font-size: 0.88rem; color: var(--muted); margin-bottom: 24px; }

  .modal-actions { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn.cancel { background: var(--bg); color: var(--ink); }
  .modal-btn.confirm { background: var(--accent); color: #fff; }
  .modal-btn:hover { opacity: 0.85; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── RESPONSIVE ── */
  @media (min-width: 480px) {
    .sector-title { font-size: 1rem; }
    .item-name { font-size: 0.92rem; }
  }
</style>
</head>
<body>

<header>
  <h1>🛒 Lista del <span>Super</span></h1>
  <div class="header-actions">
    <button class="btn-icon" onclick="expandAll()">↕ Todo</button>
    <button class="btn-icon danger" onclick="confirmClear()">↺ Nueva</button>
  </div>
</header>

<div class="progress-bar">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">0 de 0 productos tildados</div>
</div>

<main id="mainContent"></main>

<button class="fab" onclick="confirmClear()">✦ Nueva compra</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>¿Empezar nueva compra?</h2>
    <p>Se van a restablecer los checks. Los productos que agregaste se van a conservar en la lista base.</p>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn confirm" onclick="startNewTrip()">Empezar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ────────────────────────────────────────────────────────────────
// BASE DATA
// ────────────────────────────────────────────────────────────────
const BASE_SECTORS = [
  {
    id: 'almacen',
    emoji: '🫙',
    name: 'Almacén / Despensa',
    items: [
      'Tapas de empanada/tarta',
      'Arroz', 'Fideos/pasta', 'Polenta', 'Avena', 'Harina', 'Pan rallado',
      'Legumbres secas',
      'Tomate triturado/puré', 'Atún/sardina', 'Choclo en lata', 'Arvejas en lata',
      'Garbanzos en lata', 'Duraznos en almíbar',
      'Aceite', 'Vinagre', 'Sal', 'Azúcar', 'Caldos', 'Salsa de soja',
      'Ketchup', 'Mayonesa', 'Mostaza',
      'Café', 'Té', 'Yerba', 'Cacao', 'Leche larga vida',
      'Galletitas dulces', 'Galletitas saladas', 'Cereales',
      'Mermelada', 'Dulce de leche',
      'Frutos secos', 'Papas fritas', 'Galletitas de agua'
    ]
  },
  {
    id: 'lacteos',
    emoji: '🧀',
    name: 'Lácteos y Frescos',
    items: [
      'Leche', 'Yogur', 'Queso crema', 'Queso rallado', 'Manteca/margarina',
      'Huevos',
      'Jamón', 'Queso en fetas', 'Salame',
      'Pan de molde', 'Tortillas'
    ]
  },
  {
    id: 'carnes',
    emoji: '🥩',
    name: 'Carnes, Pescados y Congelados',
    items: [
      'Pollo', 'Carne vacuna', 'Cerdo',
      'Pescado fresco o congelado',
      'Verduras congeladas', 'Papas noisette', 'Medallones', 'Pizzas congeladas'
    ]
  },
  {
    id: 'frutas',
    emoji: '🥦',
    name: 'Frutas y Verduras',
    items: [
      'Lechuga', 'Tomate', 'Cebolla', 'Morrón', 'Zanahoria',
      'Papa', 'Zapallo', 'Limón',
      'Banana', 'Manzana', 'Naranja',
      'Perejil', 'Cilantro', 'Ajo'
    ]
  },
  {
    id: 'limpieza',
    emoji: '🧹',
    name: 'Artículos de Limpieza',
    items: [
      'Lavandina', 'Desinfectante', 'Limpiador multiuso', 'Limpiavidrios', 'Desengrasante',
      'Jabón líquido/polvo', 'Suavizante', 'Quitamanchas',
      'Detergente', 'Esponjas', 'Virulana', 'Paños de microfibra',
      'Cera', 'Trapo de piso', 'Escoba', 'Mopa',
      'Bolsas de basura', 'Papel aluminio', 'Film', 'Guantes'
    ]
  },
  {
    id: 'higiene',
    emoji: '🧴',
    name: 'Higiene Personal',
    items: [
      'Shampoo', 'Acondicionador', 'Jabón/gel', 'Crema de enjuague',
      'Desodorante', 'Crema corporal', 'Crema facial', 'Protector solar',
      'Cepillo dental', 'Pasta dental', 'Hilo dental', 'Enjuague bucal',
      'Máquina de afeitar', 'Espuma/gel de afeitar', 'After shave',
      'Toallitas femeninas', 'Tampones', 'Protectores diarios'
    ]
  },
  {
    id: 'perfumeria',
    emoji: '✨',
    name: 'Perfumería y Cuidado',
    items: [
      'Perfume/colonia',
      'Maquillaje',
      'Máscara capilar', 'Serum', 'Tintura',
      'Repelente', 'Alcohol en gel', 'Algodón', 'Hisopos'
    ]
  },
  {
    id: 'bebidas',
    emoji: '🥤',
    name: 'Bebidas',
    items: [
      'Agua mineral', 'Agua saborizada',
      'Gaseosas', 'Jugos',
      'Vino', 'Cerveza'
    ]
  },
  {
    id: 'extras',
    emoji: '🐾',
    name: 'Mascotas / Extras',
    items: [
      'Alimento mascotas', 'Arena sanitaria', 'Snacks mascotas',
      'Pilas', 'Lámparas',
      'Papel higiénico', 'Servilletas', 'Rollo de cocina'
    ]
  }
];

// ────────────────────────────────────────────────────────────────
// STATE MANAGEMENT (localStorage)
// ────────────────────────────────────────────────────────────────
const LS_KEY = 'superapp_v2';

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function saveState(state) {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

// Build a fresh state from BASE + any custom items persisted
function buildFreshState(existingCustom) {
  return BASE_SECTORS.map(sector => {
    const custom = (existingCustom && existingCustom[sector.id]) || [];
    const allItems = [...sector.items, ...custom];
    return {
      id: sector.id,
      emoji: sector.emoji,
      name: sector.name,
      items: allItems.map(name => ({ name, checked: false })),
      custom: custom,
      open: false
    };
  });
}

let state = [];

function initState() {
  const saved = loadState();
  if (saved && saved.sectors) {
    state = saved.sectors;
    // Sync in case BASE was updated
    state.forEach(s => {
      const base = BASE_SECTORS.find(b => b.id === s.id);
      if (base) {
        // Add any new base items not present
        base.items.forEach(name => {
          if (!s.items.find(i => i.name === name)) {
            s.items.unshift({ name, checked: false });
          }
        });
      }
    });
  } else {
    // First launch
    state = buildFreshState(null);
  }
  persist();
}

function persist() {
  saveState({ sectors: state });
}

// ────────────────────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  state.forEach(sector => {
    const checked = sector.items.filter(i => i.checked).length;
    const total = sector.items.length;

    const card = document.createElement('div');
    card.className = 'sector' + (sector.open ? ' open' : '');
    card.id = 'sector-' + sector.id;

    const countClass = checked > 0 ? 'sector-count has-checked' : 'sector-count';

    card.innerHTML = `
      <div class="sector-header" onclick="toggleSector('${sector.id}')">
        <div class="sector-emoji">${sector.emoji}</div>
        <div class="sector-title">${sector.name}</div>
        <div class="${countClass}">${checked}/${total}</div>
        <div class="sector-chevron">▼</div>
      </div>
      <div class="sector-body">
        <ul class="item-list" id="list-${sector.id}"></ul>
        <div class="add-row">
          <input class="add-input" id="input-${sector.id}" placeholder="Agregar producto…" 
            onkeydown="if(event.key==='Enter') addItem('${sector.id}')">
          <button class="add-btn" onclick="addItem('${sector.id}')">+ Agregar</button>
        </div>
      </div>
    `;

    main.appendChild(card);

    // Render items
    const ul = document.getElementById('list-' + sector.id);
    sector.items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'item' + (item.checked ? ' checked' : '');
      li.innerHTML = `
        <div class="item-check ${item.checked ? 'checked' : ''}" onclick="toggleItem('${sector.id}', ${idx})"></div>
        <span class="item-name">${item.name}</span>
        <button class="item-del" onclick="removeItem('${sector.id}', ${idx})" title="Eliminar">✕</button>
      `;
      ul.appendChild(li);
    });
  });

  updateProgress();
}

function updateProgress() {
  let total = 0, checked = 0;
  state.forEach(s => {
    total += s.items.length;
    checked += s.items.filter(i => i.checked).length;
  });
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent =
    `${checked} de ${total} producto${total !== 1 ? 's' : ''} tildado${checked !== 1 ? 's' : ''}`;
}

// ────────────────────────────────────────────────────────────────
// ACTIONS
// ────────────────────────────────────────────────────────────────
function toggleSector(id) {
  const s = state.find(s => s.id === id);
  if (s) { s.open = !s.open; persist(); render(); }
}

function toggleItem(sectorId, idx) {
  const s = state.find(s => s.id === sectorId);
  if (s) {
    s.items[idx].checked = !s.items[idx].checked;
    persist();
    // Partial re-render for performance
    const li = document.querySelector(`#list-${sectorId} li:nth-child(${idx + 1})`);
    const item = s.items[idx];
    if (li) {
      li.className = 'item' + (item.checked ? ' checked' : '');
      li.querySelector('.item-check').className = 'item-check' + (item.checked ? ' checked' : '');
    }
    // Update count badge
    const checked = s.items.filter(i => i.checked).length;
    const badge = document.querySelector(`#sector-${sectorId} .sector-count`);
    if (badge) {
      badge.textContent = `${checked}/${s.items.length}`;
      badge.className = checked > 0 ? 'sector-count has-checked' : 'sector-count';
    }
    updateProgress();
  }
}

function removeItem(sectorId, idx) {
  const s = state.find(s => s.id === sectorId);
  if (!s) return;
  const name = s.items[idx].name;
  s.items.splice(idx, 1);
  // Also remove from custom if present
  s.custom = s.custom.filter(c => c !== name);
  persist();
  render();
  showToast(`"${name}" eliminado`);
}

function addItem(sectorId) {
  const input = document.getElementById('input-' + sectorId);
  const name = input.value.trim();
  if (!name) return;

  const s = state.find(s => s.id === sectorId);
  if (!s) return;

  // Check duplicate
  if (s.items.find(i => i.name.toLowerCase() === name.toLowerCase())) {
    showToast('Ya está en la lista');
    input.value = '';
    return;
  }

  s.items.push({ name, checked: false });
  // Save to custom so it persists in future trips
  if (!s.custom) s.custom = [];
  s.custom.push(name);

  input.value = '';
  persist();
  render();
  // Re-open sector and scroll to it
  const s2 = state.find(s => s.id === sectorId);
  if (s2) s2.open = true;
  persist();
  render();
  showToast(`"${name}" agregado`);
}

function expandAll() {
  const allOpen = state.every(s => s.open);
  state.forEach(s => s.open = !allOpen);
  persist();
  render();
}

// ────────────────────────────────────────────────────────────────
// NEW TRIP
// ────────────────────────────────────────────────────────────────
function confirmClear() {
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function startNewTrip() {
  // Preserve custom items per sector
  const customMap = {};
  state.forEach(s => { customMap[s.id] = s.custom || []; });
  state = buildFreshState(customMap);
  persist();
  closeModal();
  render();
  showToast('¡Nueva compra iniciada! 🛒');
}

// ────────────────────────────────────────────────────────────────
// TOAST
// ────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ────────────────────────────────────────────────────────────────
// CLOSE MODAL ON OVERLAY CLICK
// ────────────────────────────────────────────────────────────────
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ────────────────────────────────────────────────────────────────
// BOOT
// ────────────────────────────────────────────────────────────────
initState();
render();
</script>
</body>
</html>
